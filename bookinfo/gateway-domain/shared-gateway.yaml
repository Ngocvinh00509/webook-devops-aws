apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: default
spec:
  gatewayClassName: istio
  listeners:
  - name: http-bookinfo
    hostname: "webook.dnvinh99.xyz"
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All

  - name: https-bookinfo
    hostname: "webook.dnvinh99.xyz"
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: bookinfo-tls-secret
    allowedRoutes:
      namespaces:
        from: All

  - name: http-grafana
    hostname: "grafana.dnvinh99.xyz"
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All

  - name: http-argocd
    hostname: "argocd.dnvinh99.xyz"
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All

  - name: http-vault
    hostname: "vault.dnvinh99.xyz"
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
